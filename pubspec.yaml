name: mobile_app
description: "CV AI - All-in-One Professional CV Builder, Cam Scanner & PDF Converter"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  pdf: ^3.11.1
  printing: ^5.13.2
  file_picker: ^12.1.2
  image_picker: ^1.2.3
  excel: ^4.0.6
  archive: ^3.6.1
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  camera: ^0.12.0+2
  http: ^1.2.2
  image: ^4.3.0
  xml: ^6.6.1
  google_mlkit_text_recognition: ^0.17.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.0
  supabase_flutter: ^2.8.4
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.3
  cunning_document_scanner: ^3.0.2
  permission_handler: ^13.0.1
  speech_to_text: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
